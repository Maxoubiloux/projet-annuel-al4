[package]
name = "moto-rental-worker"
version = "1.0.0"
edition = "2021"
description = "Worker asynchrone de génération de contrats de location en PDF (Rust)"

[dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "signal", "time"] }
lapin = { version = "2.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
futures = "0.3"
dotenv = "0.15"
# Génération PDF : 100 % Rust, polices PDF standard intégrées, aucune dépendance
# système — indispensable pour garder une image Docker minimale.
printpdf = "0.7"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[[bin]]
name = "worker"
path = "src/main.rs"
