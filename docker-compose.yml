services:
  postgres:
    image: postgres:15-alpine
    container_name: moto-postgres
    environment:
      POSTGRES_DB: moto_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moto-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: moto-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moto-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: moto-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/realm.json
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200 OK'",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  keycloak-config:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: moto-keycloak-config
    volumes:
      - ./docker/keycloak-user-profile.json:/config/keycloak-user-profile.json:ro
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user admin --password admin &&
      /opt/keycloak/bin/kcadm.sh update realms/moto-rental/users/profile -f /config/keycloak-user-profile.json &&
      CLIENT_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r moto-rental -q clientId=moto-rental-frontend --fields id --format csv --noquotes | tail -n 1) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$CLIENT_ID -r moto-rental -s standardFlowEnabled=true -s directAccessGrantsEnabled=false -s 'attributes.\"pkce.code.challenge.method\"=S256' &&
      ADMIN_CLIENT_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r moto-rental -q clientId=moto-rental-admin --fields id --format csv --noquotes | tail -n 1) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$ADMIN_CLIENT_ID -r moto-rental -s standardFlowEnabled=true -s directAccessGrantsEnabled=false -s 'attributes.\"pkce.code.challenge.method\"=S256' -s 'redirectUris=[\"http://localhost:5173/*\",\"http://localhost:5174/*\",\"http://localhost:4173/*\",\"http://localhost:3002/*\",\"https://admin.pleingazloc.fr/*\"]' -s 'webOrigins=[\"http://localhost:5173\",\"http://localhost:5174\",\"http://localhost:4173\",\"http://localhost:3002\",\"https://admin.pleingazloc.fr\"]' &&
      BACKEND_CLIENT_ID=$$(/opt/keycloak/bin/kcadm.sh get clients -r moto-rental -q clientId=moto-rental-backend --fields id --format csv --noquotes | tail -n 1) &&
      /opt/keycloak/bin/kcadm.sh update clients/$$BACKEND_CLIENT_ID -r moto-rental -s fullScopeAllowed=true &&
      /opt/keycloak/bin/kcadm.sh add-roles -r moto-rental --uusername service-account-moto-rental-backend --cclientid realm-management --rolename manage-users || true &&
      /opt/keycloak/bin/kcadm.sh add-roles -r moto-rental --uusername service-account-moto-rental-backend --cclientid realm-management --rolename view-users || true"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moto-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/moto_rental?schema=public
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: moto_rental
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REQUEST_QUEUE: worker_requests
      RESPONSE_QUEUE: worker_responses
      DEAD_LETTER_QUEUE: worker_dead_letters
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://localhost:8080
      KEYCLOAK_REALM: moto-rental
      KEYCLOAK_CLIENT_ID: moto-rental-backend
      KEYCLOAK_CLIENT_SECRET: backend-secret-dev
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FRONTEND_URL: http://localhost:3001
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src
      - backend_generated:/app/src/generated
      - contracts_data:/app/uploads/contracts

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: moto-worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REQUEST_QUEUE: worker_requests
      RESPONSE_QUEUE: worker_responses
      DEAD_LETTER_QUEUE: worker_dead_letters
      DEAD_LETTER_EXCHANGE: worker_dlx
      CONTRACTS_DIR: /data/contracts
      PUBLIC_BASE_URL: http://localhost:3000
      RUST_LOG: info
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - contracts_data:/data/contracts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: moto-rental
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: moto-rental-frontend
    container_name: moto-frontend
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_KEYCLOAK_URL=http://localhost:8080
      - NEXT_PUBLIC_KEYCLOAK_REALM=moto-rental
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=moto-rental-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api/v1
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: moto-rental
        VITE_KEYCLOAK_CLIENT_ID: moto-rental-admin
    container_name: moto-admin
    ports:
      - "3002:80"
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  backend_generated:
  contracts_data:
